name: CI/CD

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes e gate de cobertura (JaCoCo)
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oficina
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: chave-de-teste-para-ci-com-pelo-menos-32-caracteres
          JWT_EXPIRATION: "86400000"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: senha-de-teste-para-ci
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo, exigido pelo registry)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/oficina-app" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-smoke-test:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem para o cluster local
        run: docker build -t oficina-app:latest .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"

      - name: Instalar kind e kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Provisionar cluster (Terraform)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -target=kind_cluster.oficina

      - name: Carregar imagem no cluster
        run: kind load docker-image oficina-app:latest --name oficina

      - name: Aplicar manifestos e aguardar rollout (Terraform)
        working-directory: infra
        run: |
          terraform apply -auto-approve
          export KUBECONFIG="${GITHUB_WORKSPACE}/infra/oficina-config"
          kubectl rollout status deployment/oficina-app -n oficina --timeout=180s

      - name: Smoke test da API
        run: |
          # rollout status confirma os pods Ready, mas o kube-proxy do kind pode levar
          # alguns segundos a mais para propagar as regras de iptables do NodePort —
          # --retry-all-errors absorve esse atraso em vez de falhar na primeira tentativa.
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            http://localhost:8080/v3/api-docs > /dev/null
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"usuario":"admin","senha":"troque-esta-senha-antes-de-usar-em-producao"}' > /dev/null
          echo "Smoke test OK"

      - name: Destruir cluster
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve

  deploy-eks:
    needs: build-and-push
    if: github.event_name == 'push' && vars.DEPLOY_TO_AWS == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/oficina-app" >> "$GITHUB_ENV"

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Atualizar kubeconfig do cluster EKS
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      # rds-endpoint e rds-secret-arn são publicados no SSM Parameter Store pelo
      # Terraform de fiap-tc3-infra-db — lemos de lá em vez de remote state
      # cruzado, já que os dois repos têm pipelines/ciclos de vida independentes.
      # A senha nunca fica em texto plano no repositório: vem do master user
      # gerenciado pelo próprio RDS (manage_master_user_password, ver
      # docs/ADR-004) e só transita neste job para virar o Secret do Kubernetes.
      - name: Configurar ConfigMap/Secret com dados do RDS (SSM + Secrets Manager)
        run: |
          RDS_ENDPOINT=$(aws ssm get-parameter --name "/fiap-tc3/${AMBIENTE}/rds-endpoint" --query 'Parameter.Value' --output text)
          RDS_SECRET_ARN=$(aws ssm get-parameter --name "/fiap-tc3/${AMBIENTE}/rds-secret-arn" --query 'Parameter.Value' --output text)
          RDS_SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query 'SecretString' --output text)
          RDS_USERNAME=$(echo "$RDS_SECRET_JSON" | jq -r '.username')
          RDS_PASSWORD=$(echo "$RDS_SECRET_JSON" | jq -r '.password')
          echo "::add-mask::$RDS_PASSWORD"

          kubectl patch configmap oficina-config -n oficina --type merge \
            -p "{\"data\":{\"SPRING_DATASOURCE_URL\":\"jdbc:postgresql://${RDS_ENDPOINT}:5432/oficina\"}}"
          kubectl patch secret oficina-secret -n oficina --type merge \
            -p "{\"stringData\":{\"SPRING_DATASOURCE_USERNAME\":\"${RDS_USERNAME}\",\"SPRING_DATASOURCE_PASSWORD\":\"${RDS_PASSWORD}\"}}"

      # O EKS puxa a mesma imagem publicada no GHCR pelo job build-and-push — evita
      # duplicar registry (ECR) só para satisfazer o requisito de deploy em nuvem.
      # Roda depois do patch acima para que os pods recriados já subam com o
      # SPRING_DATASOURCE_URL/credenciais corretos (env vars só são lidas na
      # criação do pod, não recarregadas ao vivo).
      - name: Atualizar imagem do deployment
        run: |
          kubectl set image deployment/oficina-app oficina-app=${{ env.IMAGE_NAME }}:${{ github.sha }} -n oficina
          kubectl rollout status deployment/oficina-app -n oficina --timeout=180s
