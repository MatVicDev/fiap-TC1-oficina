name: CI/CD

on:
  push:
    branches: [main, TC2-refatoracao]
  pull_request:
    branches: [main, TC2-refatoracao]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oficina
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes e gate de cobertura (JaCoCo)
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/oficina
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: chave-de-teste-para-ci-com-pelo-menos-32-caracteres
          JWT_EXPIRATION: "86400000"
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo, exigido pelo registry)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/oficina-app" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-smoke-test:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem para o cluster local
        run: docker build -t oficina-app:latest .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"

      - name: Instalar kind e kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Provisionar cluster e aplicar manifestos (Terraform)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Carregar imagem no cluster e aguardar rollout
        run: |
          kind load docker-image oficina-app:latest --name oficina
          export KUBECONFIG="${GITHUB_WORKSPACE}/infra/oficina-config"
          kubectl rollout restart deployment/oficina-app -n oficina
          kubectl rollout status deployment/oficina-app -n oficina --timeout=120s

      - name: Smoke test da API
        run: |
          curl -fsS http://localhost:8080/v3/api-docs > /dev/null
          curl -fsS -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"usuario":"admin","senha":"admin123"}' > /dev/null
          echo "Smoke test OK"

      - name: Destruir cluster
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve
