services:
  postgres:
    image: postgres:16
    container_name: oficina-db
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: