apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina
data:
  DATABASE_NAME: "oficina"
  # Preenchido pelo pipeline de deploy com o endpoint do RDS (output do repositório
  # de infra do banco — fiap-tc3-infra-db). Valor abaixo é só placeholder local.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://CHANGE_ME.rds.amazonaws.com:5432/oficina"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_MAIL_HOST: "mailhog"
  SPRING_MAIL_PORT: "1025"
  JWT_EXPIRATION: "86400000"
  SPRING_APPLICATION_NAME: "oficina-app"
  DD_SERVICE: "oficina-app"
  DD_ENV: "production"
  DD_VERSION: "1.0.0"
  DD_TRACE_SAMPLE_RATE: "1"
