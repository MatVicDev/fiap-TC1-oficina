apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina
data:
  DATABASE_NAME: "oficina"
  # Aponta para o Postgres local (k8s/03-postgres.yaml), usado por docker-compose/
  # kind e pelo smoke test do CI. Em EKS real, é sobrescrito pelo job deploy-eks
  # com o endpoint do RDS (lido do SSM, publicado pelo Terraform de fiap-tc3-infra-db).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/oficina"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_MAIL_HOST: "mailhog"
  SPRING_MAIL_PORT: "1025"
  JWT_EXPIRATION: "86400000"
  SPRING_APPLICATION_NAME: "oficina-app"
  DD_SERVICE: "oficina-app"
  DD_ENV: "production"
  DD_VERSION: "1.0.0"
  DD_TRACE_SAMPLE_RATE: "1"
